<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creación de DataFrames en Pandas - Modo Claro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e0e7ff 100%);
      --card-bg: rgba(255, 255, 255, 0.7);
      --card-border: rgba(99, 102, 241, 0.15);
      --accent: #4f46e5;
      --accent-glow: rgba(79, 70, 229, 0.15);
      --text-main: #0f172a;
      --text-muted: #475569;
      --radius-xl: 24px;
      --transition-smooth: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 2.5rem;
      overflow-x: hidden;
    }

    /* INSTRUCCIÓN FLOTANTE (Glassmorphism Light) */
    .floating-instruction {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(79, 70, 229, 0.2);
      color: #3730a3;
      padding: 0.75rem 1.6rem;
      border-radius: 100px;
      font-size: 0.88rem;
      font-weight: 600;
      letter-spacing: 0.3px;
      box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.1);
      animation: float 3s infinite ease-in-out;
      text-align: center;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    /* CONTENEDOR PRINCIPAL */
    .container {
      width: 100%;
      max-width: 1000px;
    }

    .grid-cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.8rem;
      justify-content: center;
    }

    @media (max-width: 640px) {
      .grid-cards {
        grid-template-columns: 1fr;
      }
    }

    /* TARJETAS INTERACTIVAS (Glassmorphism Light + Hover Effects) */
    .card-btn {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-xl);
      height: 220px;
      cursor: pointer;
      text-align: left;
      outline: none;
      position: relative;
      overflow: hidden;
      transition: var(--transition-smooth);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 2rem;
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.05);
    }

    .card-btn::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      opacity: 0;
      transition: var(--transition-smooth);
      pointer-events: none;
    }

    .card-header-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 42px;
      height: 42px;
      padding: 0 0.8rem;
      border-radius: 14px;
      background: rgba(79, 70, 229, 0.08);
      border: 1px solid rgba(79, 70, 229, 0.2);
      color: var(--accent);
      font-weight: 700;
      font-size: 0.85rem;
      transition: var(--transition-smooth);
    }

    .card-btn h3 {
      font-size: 1.12rem;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.4;
      margin-top: 0.5rem;
    }

    .card-footer {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--accent);
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.2px;
    }

    .card-footer span {
      transition: var(--transition-smooth);
      display: inline-block;
    }

    /* HOVER & FOCUS EFFECTS */
    .card-btn:hover {
      transform: translateY(-6px);
      border-color: rgba(79, 70, 229, 0.4);
      box-shadow: 0 20px 35px -10px rgba(79, 70, 229, 0.15);
      background: rgba(255, 255, 255, 0.95);
    }

    .card-btn:hover::before {
      opacity: 1;
    }

    .card-btn:hover .card-header-badge {
      background: var(--accent);
      color: #ffffff;
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    .card-btn:hover .card-footer span {
      transform: translateX(6px);
    }

    /* VENTANA EMERGENTE (MODAL LIGHT ELEGANT) */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.35);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: var(--transition-smooth);
      z-index: 1000;
      padding: 1.5rem;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-box {
      background: #ffffff;
      background: linear-gradient(145deg, #ffffff 0%, #f8fafc 100%);
      border: 1px solid rgba(79, 70, 229, 0.15);
      border-radius: var(--radius-xl);
      padding: 2.5rem;
      max-width: 650px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      transform: scale(0.9) translateY(20px);
      transition: var(--transition-smooth);
      box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.15), 0 0 30px rgba(79, 70, 229, 0.08);
      position: relative;
    }

    .modal-overlay.active .modal-box {
      transform: scale(1) translateY(0);
    }

    .modal-close {
      position: absolute;
      top: 1.2rem;
      right: 1.2rem;
      background: rgba(15, 23, 42, 0.04);
      border: 1px solid rgba(15, 23, 42, 0.08);
      border-radius: 50%;
      width: 38px;
      height: 38px;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition-smooth);
    }

    .modal-close:hover {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    .modal-box h2 {
      font-size: 1.35rem;
      color: var(--text-main);
      margin-bottom: 1.2rem;
      padding-right: 2rem;
      line-height: 1.4;
    }

    .modal-box div.content {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.7;
    }

    .modal-box div.content p {
      margin-bottom: 1rem;
    }

    .modal-box div.content pre {
      background: #0f172a;
      border: 1px solid rgba(15, 23, 42, 0.1);
      border-radius: 12px;
      padding: 1.2rem;
      margin-bottom: 1rem;
      overflow-x: auto;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
    }

    .modal-box div.content code {
      font-family: 'Fira Code', monospace;
      font-size: 0.88rem;
      color: #38bdf8;
      line-height: 1.6;
    }

    /* CURSOR ANIMADO EFECTO TYPING */
    .typing-cursor::after {
      content: '▋';
      display: inline-block;
      margin-left: 3px;
      color: #818cf8;
      animation: blink 0.8s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .modal-hint {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: right;
      border-top: 1px solid rgba(15, 23, 42, 0.08);
      padding-top: 1rem;
    }
  </style>
</head>
<body>

  <!-- INSTRUCCIÓN FLOTANTE -->
  <div class="floating-instruction">
    ✨ Haga clic sobre las tarjetas para ampliar la información
  </div>

  <!-- REJILLA DE TARJETAS (2x3) -->
  <main class="container">
    <div class="grid-cards">

      <!-- Tarjeta 1 -->
      <button class="card-btn" onclick="openModal('1.2.5.1 Creación de DataFrame a partir de listas', `
        <p>Una de las formas más simples de crear un DataFrame es utilizando listas.</p>
        <pre><code data-code='import pandas as pd\n\n# Lista de datos\ndatos = [10, 20, 30, 40]\ndf = pd.DataFrame(datos, columns=[&quot;Valores&quot;])\nprint(df)'></code></pre>
        <p>Este método es útil cuando se trabaja con datos simples o resultados intermedios.</p>
      `)">
        <div class="card-header-badge">1.2.5.1</div>
        <h3>Creación de DataFrame a partir de listas</h3>
        <div class="card-footer">Ampliar información <span>&rarr;</span></div>
      </button>

      <!-- Tarjeta 2 -->
      <button class="card-btn" onclick="openModal('1.2.5.2 Creación de DataFrame a partir de listas múltiples', `
        <p>También es posible crear DataFrames combinando varias listas.</p>
        <pre><code data-code='nombres = [&quot;Ana&quot;, &quot;Luis&quot;, &quot;Carlos&quot;]\nedades = [23, 30, 35]\n\ndf = pd.DataFrame({\n    &quot;Nombre&quot;: nombres,\n    &quot;Edad&quot;: edades\n})\nprint(df)'></code></pre>
        <p>Este enfoque permite estructurar datos de forma tabular.</p>
      `)">
        <div class="card-header-badge">1.2.5.2</div>
        <h3>Creación de DataFrame a partir de listas múltiples</h3>
        <div class="card-footer">Ampliar información <span>&rarr;</span></div>
      </button>

      <!-- Tarjeta 3 -->
      <button class="card-btn" onclick="openModal('1.2.5.3 Creación de DataFrame a partir de diccionarios', `
        <p>Los diccionarios son una de las formas más utilizadas para crear DataFrames, ya que permiten definir columnas de manera directa.</p>
        <pre><code data-code='data = {\n    &quot;Producto&quot;: [&quot;A&quot;, &quot;B&quot;, &quot;C&quot;],\n    &quot;Ventas&quot;: [100, 150, 200]\n}\ndf = pd.DataFrame(data)\nprint(df)'></code></pre>
        <p>Este método es ampliamente utilizado en análisis de datos.</p>
      `)">
        <div class="card-header-badge">1.2.5.3</div>
        <h3>Creación de DataFrame a partir de diccionarios</h3>
        <div class="card-footer">Ampliar información <span>&rarr;</span></div>
      </button>

      <!-- Tarjeta 4 -->
      <button class="card-btn" onclick="openModal('1.2.5.4 Creación desde lista de diccionarios', `
        <p>Otra forma común es utilizar listas de diccionarios, especialmente cuando se trabaja con registros.</p>
        <pre><code data-code='data = [\n    {&quot;Nombre&quot;: &quot;Ana&quot;, &quot;Edad&quot;: 23},\n    {&quot;Nombre&quot;: &quot;Luis&quot;, &quot;Edad&quot;: 30}\n]\ndf = pd.DataFrame(data)\nprint(df)'></code></pre>
        <p>Este formato es muy utilizado cuando los datos provienen de APIs o archivos JSON.</p>
      `)">
        <div class="card-header-badge">1.2.5.4</div>
        <h3>Creación desde lista de diccionarios</h3>
        <div class="card-footer">Ampliar información <span>&rarr;</span></div>
      </button>

      <!-- Tarjeta 5 -->
      <button class="card-btn" onclick="openModal('1.2.5.5 Creación de DataFrame desde archivos CSV', `
        <p>Los archivos CSV son una de las fuentes más comunes en análisis de datos.</p>
        <pre><code data-code='df = pd.read_csv(&quot;datos.csv&quot;)\nprint(df.head())'></code></pre>
        <p>Este método permite cargar datos reales para su análisis.</p>
      `)">
        <div class="card-header-badge">1.2.5.5</div>
        <h3>Creación de DataFrame desde archivos CSV</h3>
        <div class="card-footer">Ampliar información <span>&rarr;</span></div>
      </button>

      <!-- Tarjeta 6 -->
      <button class="card-btn" onclick="openModal('1.2.5.6 Creación desde archivos Excel', `
        <p>Pandas también permite trabajar con archivos Excel.</p>
        <pre><code data-code='df = pd.read_excel(&quot;datos.xlsx&quot;)\nprint(df.head())'></code></pre>
        <p>Esto es útil en entornos empresariales donde los datos suelen almacenarse en hojas de cálculo.</p>
      `)">
        <div class="card-header-badge">1.2.5.6</div>
        <h3>Creación desde archivos Excel</h3>
        <div class="card-footer">Ampliar información <span>&rarr;</span></div>
      </button>

    </div>
  </main>

  <!-- PANTALLA EMERGENTE / MODAL -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModalOnOutside(event)">
    <div class="modal-box" role="dialog" aria-modal="true">
      <button class="modal-close" onclick="closeModal()" aria-label="Cerrar">&times;</button>
      <h2 id="modalTitle">Título de la sección</h2>
      <div class="content" id="modalBody">Descripción detallada...</div>
      <div class="modal-hint">Presione <strong>Esc</strong> para cerrar</div>
    </div>
  </div>

  <script>
    const modalOverlay = document.getElementById('modalOverlay');
    const modalTitle = document.getElementById('modalTitle');
    const modalBody = document.getElementById('modalBody');
    let typingTimeouts = [];

    function openModal(title, htmlContent) {
      clearTypingTimeouts();
      modalTitle.innerText = title;
      modalBody.innerHTML = htmlContent;
      modalOverlay.classList.add('active');

      const codeBlocks = modalBody.querySelectorAll('code[data-code]');
      codeBlocks.forEach(codeEl => {
        const fullText = codeEl.getAttribute('data-code');
        typeCodeEffect(codeEl, fullText);
      });
    }

    function typeCodeEffect(element, text) {
      element.textContent = '';
      element.classList.add('typing-cursor');
      let index = 0;

      function typeChar() {
        if (index < text.length) {
          element.textContent += text.charAt(index);
          index++;
          const timeout = setTimeout(typeChar, 25);
          typingTimeouts.push(timeout);
        } else {
          element.classList.remove('typing-cursor');
        }
      }

      typeChar();
    }

    function clearTypingTimeouts() {
      typingTimeouts.forEach(timeout => clearTimeout(timeout));
      typingTimeouts = [];
    }

    function closeModal() {
      modalOverlay.classList.remove('active');
      clearTypingTimeouts();
    }

    function closeModalOnOutside(event) {
      if (event.target === modalOverlay) {
        closeModal();
      }
    }

    document.addEventListener('keydown', function(event) {
      if (event.key === 'Escape' && modalOverlay.classList.contains('active')) {
        closeModal();
      }
    });
  </script>
</body>
</html>
