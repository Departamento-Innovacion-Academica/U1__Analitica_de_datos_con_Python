<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estructuras y Operaciones en Pandas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #818cf8;
      --accent-glow: rgba(129, 140, 248, 0.25);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --radius-xl: 24px;
      --transition-smooth: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 2.5rem;
      overflow-x: hidden;
    }

    /* INSTRUCCIÓN FLOTANTE (Glassmorphism) */
    .floating-instruction {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #c7d2fe;
      padding: 0.75rem 1.6rem;
      border-radius: 100px;
      font-size: 0.88rem;
      font-weight: 500;
      letter-spacing: 0.3px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
      animation: float 3s infinite ease-in-out;
      text-align: center;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    /* CONTENEDOR PRINCIPAL */
    .container {
      width: 100%;
      max-width: 1000px;
    }

    .grid-cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.8rem;
      justify-content: center;
    }

    @media (max-width: 640px) {
      .grid-cards {
        grid-template-columns: 1fr;
      }
    }

    /* TARJETAS INTERACTIVAS (Borde Brillante + Glassmorphism) */
    .card-btn {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-xl);
      height: 220px;
      cursor: pointer;
      text-align: left;
      outline: none;
      position: relative;
      overflow: hidden;
      transition: var(--transition-smooth);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 2rem;
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }

    .card-btn::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      opacity: 0;
      transition: var(--transition-smooth);
      pointer-events: none;
    }

    .card-header-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: rgba(129, 140, 248, 0.1);
      border: 1px solid rgba(129, 140, 248, 0.2);
      color: var(--accent);
      font-weight: 700;
      font-size: 0.9rem;
      transition: var(--transition-smooth);
    }

    .card-btn h3 {
      font-size: 1.12rem;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.4;
      margin-top: 0.5rem;
    }

    .card-footer {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--accent);
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.2px;
    }

    .card-footer span {
      transition: var(--transition-smooth);
      display: inline-block;
    }

    /* HOVER & FOCUS EFFECTS */
    .card-btn:hover {
      transform: translateY(-6px);
      border-color: rgba(129, 140, 248, 0.4);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7), 0 0 30px var(--accent-glow);
      background: rgba(255, 255, 255, 0.07);
    }

    .card-btn:hover::before {
      opacity: 1;
    }

    .card-btn:hover .card-header-badge {
      background: var(--accent);
      color: #0f172a;
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .card-btn:hover .card-footer span {
      transform: translateX(6px);
    }

    /* VENTANA EMERGENTE (MODAL DARK MODERN) */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: var(--transition-smooth);
      z-index: 1000;
      padding: 1.5rem;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-box {
      background: linear-gradient(145deg, #1e1b4b 0%, #0f172a 100%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: var(--radius-xl);
      padding: 2.5rem;
      max-width: 650px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      transform: scale(0.9) translateY(20px);
      transition: var(--transition-smooth);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 40px rgba(129, 140, 248, 0.15);
      position: relative;
    }

    .modal-overlay.active .modal-box {
      transform: scale(1) translateY(0);
    }

    .modal-close {
      position: absolute;
      top: 1.2rem;
      right: 1.2rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      width: 38px;
      height: 38px;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition-smooth);
    }

    .modal-close:hover {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
    }

    .modal-box h2 {
      font-size: 1.35rem;
      color: #f1f5f9;
      margin-bottom: 1.2rem;
      padding-right: 2rem;
      line-height: 1.4;
    }

    .modal-box div.content {
      color: #cbd5e1;
      font-size: 0.95rem;
      line-height: 1.7;
    }

    .modal-box div.content p {
      margin-bottom: 1rem;
    }

    .modal-box div.content pre {
      background: #090d16;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 1.2rem;
      margin-bottom: 1rem;
      overflow-x: auto;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.6);
    }

    .modal-box div.content code {
      font-family: 'Fira Code', monospace;
      font-size: 0.88rem;
      color: #38bdf8;
      line-height: 1.6;
    }

    /* CURSOR ANIMADO EFECTO TYPING */
    .typing-cursor::after {
      content: '▋';
      display: inline-block;
      margin-left: 3px;
      color: #818cf8;
      animation: blink 0.8s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .modal-hint {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: right;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 1rem;
    }
  </style>
</head>
<body>

  <!-- INSTRUCCIÓN FLOTANTE -->
  <div class="floating-instruction">
    ✨ Haga clic sobre las tarjetas para explorar el código
  </div>

  <!-- REJILLA DE TARJETAS (2x3) -->
  <main class="container">
    <div class="grid-cards">

      <!-- Tarjeta 1 -->
      <button class="card-btn" onclick="openModal('1.2.4.1 Series: estructura unidimensional', `
        <p>Una Series es una estructura de datos unidimensional que puede contener cualquier tipo de datos (numéricos, texto, booleanos, etc.) y que está asociada a un índice.</p>
        <pre><code data-code='import pandas as pd\n\nserie = pd.Series([10, 20, 30, 40])\nprint(serie)'></code></pre>
        <p>Cada elemento de la serie tiene un índice que permite acceder a su valor.</p>
        <p>Acceso a elementos:</p>
        <pre><code data-code='print(serie[0])  # Primer elemento'></code></pre>
        <p>Series con índice personalizado:</p>
        <pre><code data-code='serie = pd.Series([100, 200, 300], index=[&quot;A&quot;, &quot;B&quot;, &quot;C&quot;])\nprint(serie[&quot;A&quot;])'></code></pre>
        <p>Esto permite identificar los datos de forma más descriptiva.</p>
      `)">
        <div class="card-header-badge">01</div>
        <h3>1.2.4.1 Series: estructura unidimensional</h3>
        <div class="card-footer">Ampliar información <span>&rarr;</span></div>
      </button>

      <!-- Tarjeta 2 -->
      <button class="card-btn" onclick="openModal('1.2.4.2 Operaciones con Series', `
        <p>Las Series permiten realizar operaciones vectorizadas de manera eficiente.</p>
        <pre><code data-code='serie = pd.Series([1, 2, 3, 4])\nprint(serie * 2)\nprint(serie.mean())'></code></pre>
        <p>Estas operaciones son fundamentales en el análisis de datos.</p>
      `)">
        <div class="card-header-badge">02</div>
        <h3>1.2.4.2 Operaciones con Series</h3>
        <div class="card-footer">Ampliar información <span>&rarr;</span></div>
      </button>

      <!-- Tarjeta 3 -->
      <button class="card-btn" onclick="openModal('1.2.4.3 DataFrame: estructura bidimensional', `
        <p>Un DataFrame es una estructura de datos bidimensional similar a una tabla, donde las filas representan registros y las columnas representan variables.</p>
        <pre><code data-code='data = {\n    &quot;Nombre&quot;: [&quot;Ana&quot;, &quot;Luis&quot;, &quot;Carlos&quot;],\n    &quot;Edad&quot;: [23, 30, 35]\n}\ndf = pd.DataFrame(data)\nprint(df)'></code></pre>
      `)">
        <div class="card-header-badge">03</div>
        <h3>1.2.4.3 DataFrame: estructura bidimensional</h3>
        <div class="card-footer">Ampliar información <span>&rarr;</span></div>
      </button>

      <!-- Tarjeta 4 -->
      <button class="card-btn" onclick="openModal('1.2.4.4 Acceso a datos en DataFrame', `
        <p>Selección de columnas:</p>
        <pre><code data-code='print(df[&quot;Edad&quot;])'></code></pre>
        <p>Selección de filas:</p>
        <pre><code data-code='print(df.iloc[0])'></code></pre>
      `)">
        <div class="card-header-badge">04</div>
        <h3>1.2.4.4 Acceso a datos en DataFrame</h3>
        <div class="card-footer">Ampliar información <span>&rarr;</span></div>
      </button>

      <!-- Tarjeta 5 -->
      <button class="card-btn" onclick="openModal('1.2.4.5 Uso de índices en DataFrame', `
        <p>Los DataFrames utilizan índices para identificar filas.</p>
        <pre><code data-code='df.index = [&quot;a&quot;, &quot;b&quot;, &quot;c&quot;]\nprint(df.loc[&quot;a&quot;])'></code></pre>
        <p>Esto permite acceder a los datos de forma más estructurada.</p>
      `)">
        <div class="card-header-badge">05</div>
        <h3>1.2.4.5 Uso de índices en DataFrame</h3>
        <div class="card-footer">Ampliar información <span>&rarr;</span></div>
      </button>

      <!-- Tarjeta 6 -->
      <button class="card-btn" onclick="openModal('1.2.4.6 Operaciones con DataFrame', `
        <pre><code data-code='# Promedio\nprint(df[&quot;Edad&quot;].mean())\n\n# Filtro\nprint(df[df[&quot;Edad&quot;] > 25])'></code></pre>
        <p>Estas operaciones son esenciales en el análisis de datos.</p>
      `)">
        <div class="card-header-badge">06</div>
        <h3>1.2.4.6 Operaciones con DataFrame</h3>
        <div class="card-footer">Ampliar información <span>&rarr;</span></div>
      </button>

    </div>
  </main>

  <!-- PANTALLA EMERGENTE / MODAL -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModalOnOutside(event)">
    <div class="modal-box" role="dialog" aria-modal="true">
      <button class="modal-close" onclick="closeModal()" aria-label="Cerrar">&times;</button>
      <h2 id="modalTitle">Título de la sección</h2>
      <div class="content" id="modalBody">Descripción detallada...</div>
      <div class="modal-hint">Presione <strong>Esc</strong> para cerrar</div>
    </div>
  </div>

  <script>
    const modalOverlay = document.getElementById('modalOverlay');
    const modalTitle = document.getElementById('modalTitle');
    const modalBody = document.getElementById('modalBody');
    let typingTimeouts = [];

    function openModal(title, htmlContent) {
      clearTypingTimeouts();
      modalTitle.innerText = title;
      modalBody.innerHTML = htmlContent;
      modalOverlay.classList.add('active');

      const codeBlocks = modalBody.querySelectorAll('code[data-code]');
      codeBlocks.forEach(codeEl => {
        const fullText = codeEl.getAttribute('data-code');
        typeCodeEffect(codeEl, fullText);
      });
    }

    function typeCodeEffect(element, text) {
      element.textContent = '';
      element.classList.add('typing-cursor');
      let index = 0;

      function typeChar() {
        if (index < text.length) {
          element.textContent += text.charAt(index);
          index++;
          const timeout = setTimeout(typeChar, 25);
          typingTimeouts.push(timeout);
        } else {
          element.classList.remove('typing-cursor');
        }
      }

      typeChar();
    }

    function clearTypingTimeouts() {
      typingTimeouts.forEach(timeout => clearTimeout(timeout));
      typingTimeouts = [];
    }

    function closeModal() {
      modalOverlay.classList.remove('active');
      clearTypingTimeouts();
    }

    function closeModalOnOutside(event) {
      if (event.target === modalOverlay) {
        closeModal();
      }
    }

    document.addEventListener('keydown', function(event) {
      if (event.key === 'Escape' && modalOverlay.classList.contains('active')) {
        closeModal();
      }
    });
  </script>
</body>
</html>
