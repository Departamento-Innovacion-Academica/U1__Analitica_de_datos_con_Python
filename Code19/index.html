<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estadísticas y Exploración de Datos - Dark Mode</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0f172a 60%, #020617 100%);
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(99, 102, 241, 0.25);
      --accent: #818cf8;
      --accent-glow: rgba(99, 102, 241, 0.35);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --radius-xl: 24px;
      --transition-smooth: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 2.5rem;
      overflow-x: hidden;
    }

    /* INSTRUCCIÓN FLOTANTE (Glassmorphism Dark) */
    .floating-instruction {
      background: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(129, 140, 248, 0.3);
      color: #c7d2fe;
      padding: 0.75rem 1.6rem;
      border-radius: 100px;
      font-size: 0.88rem;
      font-weight: 600;
      letter-spacing: 0.3px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 0 15px rgba(99, 102, 241, 0.2);
      animation: float 3s infinite ease-in-out;
      text-align: center;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    /* CONTENEDOR PRINCIPAL */
    .container {
      width: 100%;
      max-width: 1000px;
    }

    .grid-cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.8rem;
      justify-content: center;
    }

    .grid-cards .card-full {
      grid-column: span 2;
    }

    @media (max-width: 640px) {
      .grid-cards {
        grid-template-columns: 1fr;
      }
      .grid-cards .card-full {
        grid-column: span 1;
      }
    }

    /* TARJETAS INTERACTIVAS (Glassmorphism Dark) */
    .card-btn {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-xl);
      height: 220px;
      cursor: pointer;
      text-align: left;
      outline: none;
      position: relative;
      overflow: hidden;
      transition: var(--transition-smooth);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 2rem;
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.3);
    }

    .card-btn::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      opacity: 0;
      transition: var(--transition-smooth);
      pointer-events: none;
    }

    .card-header-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 38px;
      padding: 0 1rem;
      border-radius: 12px;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(129, 140, 248, 0.3);
      color: var(--accent);
      font-weight: 700;
      font-size: 0.85rem;
      transition: var(--transition-smooth);
      align-self: flex-start;
    }

    .card-btn h3 {
      font-size: 1.12rem;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.4;
      margin-top: 0.5rem;
    }

    .card-footer {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--accent);
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.2px;
    }

    .card-footer span {
      transition: var(--transition-smooth);
      display: inline-block;
    }

    /* HOVER & FOCUS EFFECTS */
    .card-btn:hover {
      transform: translateY(-6px);
      border-color: rgba(129, 140, 248, 0.6);
      box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.5), 0 0 20px rgba(99, 102, 241, 0.2);
      background: rgba(30, 41, 59, 0.9);
    }

    .card-btn:hover::before {
      opacity: 1;
    }

    .card-btn:hover .card-header-badge {
      background: var(--accent);
      color: #0f172a;
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .card-btn:hover .card-footer span {
      transform: translateX(6px);
    }

    /* VENTANA EMERGENTE (MODAL DARK) */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(2, 6, 23, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: var(--transition-smooth);
      z-index: 1000;
      padding: 1.5rem;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-box {
      background: #0f172a;
      background: linear-gradient(145deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid rgba(129, 140, 248, 0.25);
      border-radius: var(--radius-xl);
      padding: 2.5rem;
      max-width: 680px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      transform: scale(0.9) translateY(20px);
      transition: var(--transition-smooth);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 30px rgba(99, 102, 241, 0.15);
      position: relative;
    }

    .modal-overlay.active .modal-box {
      transform: scale(1) translateY(0);
    }

    .modal-close {
      position: absolute;
      top: 1.2rem;
      right: 1.2rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      width: 38px;
      height: 38px;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition-smooth);
    }

    .modal-close:hover {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
    }

    .modal-box h2 {
      font-size: 1.35rem;
      color: #f8fafc;
      margin-bottom: 1.2rem;
      padding-right: 2rem;
      line-height: 1.4;
    }

    .modal-box div.content {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.7;
    }

    .modal-box div.content p {
      margin-bottom: 0.6rem;
    }

    .modal-box div.content ul {
      margin-left: 1.2rem;
      margin-bottom: 1rem;
    }

    .modal-box div.content li {
      margin-bottom: 0.3rem;
    }

    .modal-box div.content p.section-sublabel {
      font-weight: 600;
      color: #e2e8f0;
      margin-top: 1rem;
      margin-bottom: 0.4rem;
    }

    .modal-box div.content pre {
      background: #020617;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 1.2rem;
      margin-bottom: 1rem;
      overflow-x: auto;
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.5);
    }

    .modal-box div.content code {
      font-family: 'Fira Code', monospace;
      font-size: 0.88rem;
      color: #38bdf8;
      line-height: 1.6;
    }

    /* CURSOR ANIMADO EFECTO TYPING */
    .typing-cursor::after {
      content: '▋';
      display: inline-block;
      margin-left: 3px;
      color: #818cf8;
      animation: blink 0.8s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .modal-hint {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: right;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 1rem;
    }
  </style>
</head>
<body>

  <!-- INSTRUCCIÓN FLOTANTE -->
  <div class="floating-instruction">
    ✨ Haga clic sobre las tarjetas para ampliar la información
  </div>

  <!-- REJILLA DE TARJETAS -->
  <main class="container">
    <div class="grid-cards">

      <!-- Tarjeta 1.3.5 -->
      <button class="card-btn" onclick="openModal('1.3.5 Estadísticas descriptivas iniciales', `
        <p>Las estadísticas descriptivas permiten obtener un resumen general de los datos.</p>
        <pre><code data-code='print(df.describe())'></code></pre>
        <p>Este método calcula automáticamente:</p>
        <ul>
          <li>Promedio.</li>
          <li>Desviación estándar.</li>
          <li>Valores mínimos y máximos.</li>
          <li>Percentiles.</li>
        </ul>
        <p class=&quot;section-sublabel&quot;>Calcular métricas específicas:</p>
        <pre><code data-code='print(df[&quot;Edad&quot;].mean())\nprint(df[&quot;Edad&quot;].max())'></code></pre>
        <p>Estas estadísticas ayudan a entender el comportamiento de los datos.</p>
      `)">
        <div class="card-header-badge">1.3.5</div>
        <h3>Estadísticas descriptivas iniciales</h3>
        <div class="card-footer">Ampliar información <span>&rarr;</span></div>
      </button>

      <!-- Tarjeta 1.3.6 -->
      <button class="card-btn" onclick="openModal('1.3.6 Identificación de valores faltantes y datos inconsistentes', `
        <p>Uno de los problemas más comunes en análisis de datos es la presencia de valores faltantes o inconsistentes.</p>
        <p class=&quot;section-sublabel&quot;>Identificación de valores nulos:</p>
        <pre><code data-code='print(df.isnull().sum())'></code></pre>
        <p class=&quot;section-sublabel&quot;>Eliminación de valores nulos:</p>
        <pre><code data-code='df = df.dropna()'></code></pre>
        <p class=&quot;section-sublabel&quot;>Reemplazo de valores:</p>
        <pre><code data-code='df[&quot;Edad&quot;] = df[&quot;Edad&quot;].fillna(df[&quot;Edad&quot;].mean())'></code></pre>
        <p class=&quot;section-sublabel&quot;>Datos inconsistentes:</p>
        <pre><code data-code='print(df[&quot;Edad&quot;].unique())'></code></pre>
        <p>Esto permite detectar valores incorrectos o duplicados.</p>
      `)">
        <div class="card-header-badge">1.3.6</div>
        <h3>Identificación de valores faltantes y datos inconsistentes</h3>
        <div class="card-footer">Ampliar información <span>&rarr;</span></div>
      </button>

      <!-- Tarjeta 1.3.7 -->
      <button class="card-btn card-full" onclick="openModal('1.3.7 Exploración básica del conjunto de datos', `
        <p>La exploración inicial permite comprender mejor los datos antes de analizarlos en profundidad.</p>
        
        <p class=&quot;section-sublabel&quot;>Conteo de valores:</p>
        <pre><code data-code='print(df[&quot;Ciudad&quot;].value_counts())'></code></pre>

        <p class=&quot;section-sublabel&quot;>Correlación entre variables:</p>
        <pre><code data-code='print(df.corr())'></code></pre>

        <p class=&quot;section-sublabel&quot;>Visualización básica:</p>
        <pre><code data-code='import matplotlib.pyplot as plt\n\ndf[&quot;Edad&quot;].hist()\nplt.show()'></code></pre>

        <p class=&quot;section-sublabel&quot;>Ejemplo integrado:</p>
        <pre><code data-code='import pandas as pd\n\n# Cargar datos\ndf = pd.read_csv(&quot;datos.csv&quot;)\n\n# Inspección\nprint(df.head())\nprint(df.info())\n\n# Estadísticas\nprint(df.describe())\n\n# Valores nulos\nprint(df.isnull().sum())\n\n# Filtrado\nprint(df[df[&quot;Edad&quot;] > 30])'></code></pre>

        <p>Este flujo representa un proceso básico de exploración de datos.</p>
      `)">
        <div class="card-header-badge">1.3.7</div>
        <h3>Exploración básica del conjunto de datos</h3>
        <div class="card-footer">Ampliar información <span>&rarr;</span></div>
      </button>

    </div>
  </main>

  <!-- PANTALLA EMERGENTE / MODAL -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModalOnOutside(event)">
    <div class="modal-box" role="dialog" aria-modal="true">
      <button class="modal-close" onclick="closeModal()" aria-label="Cerrar">&times;</button>
      <h2 id="modalTitle">Título de la sección</h2>
      <div class="content" id="modalBody">Descripción detallada...</div>
      <div class="modal-hint">Presione <strong>Esc</strong> para cerrar</div>
    </div>
  </div>

  <script>
    const modalOverlay = document.getElementById('modalOverlay');
    const modalTitle = document.getElementById('modalTitle');
    const modalBody = document.getElementById('modalBody');
    let typingTimeouts = [];

    function openModal(title, htmlContent) {
      clearTypingTimeouts();
      modalTitle.innerText = title;
      modalBody.innerHTML = htmlContent;
      modalOverlay.classList.add('active');

      const codeBlocks = modalBody.querySelectorAll('code[data-code]');
      codeBlocks.forEach(codeEl => {
        const fullText = codeEl.getAttribute('data-code');
        typeCodeEffect(codeEl, fullText);
      });
    }

    function typeCodeEffect(element, text) {
      element.textContent = '';
      element.classList.add('typing-cursor');
      let index = 0;

      function typeChar() {
        if (index < text.length) {
          element.textContent += text.charAt(index);
          index++;
          const timeout = setTimeout(typeChar, 20);
          typingTimeouts.push(timeout);
        } else {
          element.classList.remove('typing-cursor');
        }
      }

      typeChar();
    }

    function clearTypingTimeouts() {
      typingTimeouts.forEach(timeout => clearTimeout(timeout));
      typingTimeouts = [];
    }

    function closeModal() {
      modalOverlay.classList.remove('active');
      clearTypingTimeouts();
    }

    function closeModalOnOutside(event) {
      if (event.target === modalOverlay) {
        closeModal();
      }
    }

    document.addEventListener('keydown', function(event) {
      if (event.key === 'Escape' && modalOverlay.classList.contains('active')) {
        closeModal();
      }
    });
  </script>
</body>
</html>
